<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <title>Tag de Link</title>
    </head>
    <body>
        <h1>Links</h1>

        <!-- link padrão -->
        <h3>Estrutura de link</h3>
        <a href="HyperLink">Link</a>

        <!-- parâmetro nova aba -->
        <h3>Parâmetro target</h3>
        <a href="https://www.google.com" target="_blank">Abrir Google</a>

        <!-- link interno -->
        <h3>Link interno</h3>
        <a href="#nomeDaSecao">Ir para uma seção da página. Essa opção Só funciona se um trecho da página estiver com uma classe definida</a>
    </body>
</html>
