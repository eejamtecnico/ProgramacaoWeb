<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>tag de imagem</title>
  </head>
  <body>
    <h1>Imagem</h1>

    <!-- inserindo imagem -->
    <figure>
      <img src="arquivos/imagem/foto.png" width="30%" height="30%" alt="Texto para acessibilidade" title="Não é mais moderno" />
      <figcaption>Narutinho</figcaption>
    </figure>

    <p>Parâmetros:</p>
    <ul>
      <li>src: local da imagem;</li>
      <li> alt: descrição da imagem para leitores de texto para pessoas com baixa visão;</li>
      <li>title: título da imagem;</li>
      <li>height: altura da imagem;</li>
      <li>width: largura da imagem;</li>
      <li>figure: tag semântica;</li>
      <li>figcaption: legenda da imagem.</li>
    </ul>
  </body>
</html>
