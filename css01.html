<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <!-- Configurações e metadados -->
        <meta charset="utf-8">
        <title>Box model</title>
        <!-- CSS interno (só estou usando para fins didáticos. Na prática usa-se o CSS externo.)-->
        <style>
            /** Conteúdo: width, max-width, min-width, heigth, max-heigth e min-heigth **/
            p{
                width: 100px;
                max-width: 150px;
                min-width: 60px;
                heigth: 100px;
                max-heigth: 150px;
                min-heigth: 50px;
            }
            /** Margem: margin, margin-top, margin-right, margin-bottom e margin-left **/
            p{
                margin: 10px;
                margin-top: 15px;
                margin-right: 35px;
                margin-bottom: 10px;
                margin-left: 5px;
            }

            /** Área de preenchimento: padding, padding-top, padding-right, padding-bottom e padding-left **/
            p{
                padding: 5px; 
                padding-top: 10px;
                padding-right:15px;
                padding-bottom:20px;
                padding-left: 25px;
            }

            /** Borda:  **/
            /** Borda genérica: "border: largura estilo cor  **/
            /** Propriedade border-style. Valores:
                dotted- Define uma borda pontilhada
                dashed- Define uma borda tracejada
                solid- Define uma borda sólida
                double- Define uma borda dupla
                groove- Define uma borda com ranhuras em 3D. O efeito depende do valor da cor da borda.
                ridge- Define uma borda texturizada em 3D. O efeito depende do valor da cor da borda.
                inset- Define uma borda interna 3D. O efeito depende do valor da cor da borda.
                outset- Define uma borda inicial 3D. O efeito depende do valor da cor da borda.
                none- Não define nenhuma fronteira
                hidden- Define uma borda oculta
            **/
            /** Propriedade border-width. Valores: numéricos, variando de 1 a 4.
                    1 valor: borda genérica, serve para todos os lados;
                    2 valores: top/botton e left/right
                    3 valores: top, left/right e botton.
                    4 valores: top, right, botton e left. 
            **/
            /** Propriedade border-color. Aceita os valores em hexadecimal (recomendado) ou nome das cores (em inglês).
            OBS1: podem ter até 4 valores:
                    1 valor: cor genérica, serve para todos os lados;
                    2 valores: top/botton e left/right
                    3 valores: top, left/right e botton.
                    4 valores: top, right, botton e left. 
            OBS2: Sempre declare a propriedade `border-style` antes da border-color. Um elemento precisa ter bordas para que você possa alterar a cor.
            **/
            p{
                border: 1px dotted purple;
            }

        </style>
    </head>
    <body>
        <p>Olá, pessoal</p>
    </body>
</html>
