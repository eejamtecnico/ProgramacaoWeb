<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <title>tag de vídeo</title>
    </head>
    <body>
        <video controls poster="arquivos/imagem/foto.png" width="640">
            <source src="arquivos/video/filme.mp4" type="video/mp4">
        </video>
        <p>Parâmetros:</p>
                <p>controls: mostra os controles de reprodução.</p>
                <p>autoplay: tenta iniciar automaticamente.</p>
                <p>muted: inicia sem áudio.</p>
                <p>loop: repete o vídeo continuamente.</p>
                <p>poster: exibe uma imagem antes da reprodução.</p>
                <p>width/height: definem o tamanho do vídeo.</p>
    </body>
</html>
