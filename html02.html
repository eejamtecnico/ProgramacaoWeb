<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Tags de lista</title>
    </head>
    <body>
        <!-- lista ordenada -->
        <ol>
            <li>Item 01</li>
            <li>Item 02</li>
            <li>Item 03</li>
        </ol>
        
        <!-- lista não ordenada -->
        <ul>
            <li>Item 01</li>
            <li>Item 02</li>
            <li>Item 03</li>
        </ul>
        
        <!-- lista de definição -->
        <dl>
            <dt>Termo a ser definido</dt>
            <dd>Descrição do termo</dd>
            <dt>Outro termo a ser definido</dt>
            <dd>Descrição deste outro termo</dd>
        </dl>
    </body>
</html>
