<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Listas</title>
    </head>
    <body>
        <ol>
            <li>Item 01</li>
            <li>Item 02</li>
            <li>Item 03</li>
        </ol>
        <ul>
            <li>Item 01</li>
            <li>Item 02</li>
            <li>Item 03</li>
        </ul>
        <dl>
            <dt>Termo a ser definido</dt>
            <dd>Descrição do termo</dd>
            <dt>Outro termo a ser definido</dt>
            <dd>Descrição deste outro termo</dd>
        </dl>
        
    </body>
</html>
