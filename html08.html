<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <!-- Configurações e metadados -->
        <meta charset="utf-8">
        <title>Tags de formulário</title>
    </head>
    <body>
        <!-- conteúdo da página -->
        <h2>Formulários</h2>
            <!-- campo de texto -->
            <form>
                <label for="inCpf">Campo de texto curto</label>
                <input type="text" id="inCpf" name="inCpf" placeholder="Usuário"/>
            </form>

            <!-- campo de senha -->
            <form>
                <label for="inPass">Campo de senha</label>
                <input type="password" id="inPass" name="inPass" placeholder="Senha"/>
            </form>

            <!-- campo de email -->
            <form>
                <label for="inEmail">Campo de email</label>
                <input type="email" id="inEmail" name="inEmail" placeholder="modelo@email.com"/>
            </form>

            <!-- campo de telefone -->
            <form>
                <label for="inTel">Campo de telefone</label>
                <input type="tel" id="inTel" name="inTel" placeholder="(xx)x xxxx xxx" />
            </form>

            <!-- campo de endereço de site -->
            <form>
                <label for="inUrl">Campo de endereço de site</label>
                <input type="url" id="inUrl" name="inUrl" placeholder="www.seusite.com.br"  />
            </form>

            

            <!-- campo de busca -->
            <form>
                <label for="inBusca">Campo de busca</label>
                <input type="search" id="inBusca" name="inBusca" placeholder="O que você está buscando"/>
            </form>

            <!-- Campos sem placeholder-->
            <!-- campo de data -->
            <form>
                <label for="inData">Campo de data</label>
                <input type="date" id="inData" name="inData" >
            </form>

            <!-- campo de hora -->
            <form>
                <label for="inHora">Campo de hora </label>
                <input type="time" id="inHora" name="inHora"/>
            </form>

            <!-- campo de deslizar -->
            <form>
                <label for="inDeslizar">Campo de deslizar</label>
                <input type="range"  id="inDeslizar" name="inDeslizar"/>
            </form>

            <!-- campo de upload de arquivo -->
            <form>
                <label>Campo de upload de arquivo</label>
                <!-- campo padrão -->
                <input type="file" id="inArquivo" name="inArquivo" />
                <br />
                
                <!-- caso queira limitar os tipos de arquivos permitidos passando as extensões válidas -->
                <input type="file" id="inArquivo" name="inArquivo" accept=".png, .jpg, .jpeg" />
                <br />

                <!-- caso queira limitar os tipos de arquivos permitidos passando o tipo de mídia válida (image, video, application etc.) -->
                <input type="file" id="inArquivo" name="inArquivo" accept="image/*" />
                <br />
                <input type="file" id="inArquivo" name="inArquivo" accept="application/pdf" />
                <br />
            </form>

            <!-- value pode definir o valor enviado ao servidor quando o formulário é submetido ou inicializar um campo com um valor -->

            <!-- campo de numero -->
            <form>
                <label for="inNumero">Campo de endereço de site</label>
                <input type="number" id="inNumero" name="inNumero"  value="0"/> <!-- inicializo o campo com 0, mas o usuário pode alterar -->
            </form>

            <!-- campo de checkbox -->
            <form>
                <input type="checkbox" id="html" name="fav_linguagem" value="HTML">
                <label for="html">HTML</label><br />
                
                <input type="checkbox" id="css" name="fav_linguagem" value="CSS">
                <label for="css">CSS</label><br />
                
                <input type="checkbox" id="javascript" name="fav_linguagem" value="JavaScript">
                <label for="javascript">JavaScript</label><br />
            </form>

            <!-- campo de radio -->
            <form>
                <input type="radio" id="html" name="fav_linguagem" value="HTML">
                <label for="html">HTML</label><br />
                
                <input type="radio" id="css" name="fav_linguagem" value="CSS">
                <label for="css">CSS</label><br />
                
                <input type="radio" id="javascript" name="fav_linguagem" value="JavaScript">
                <label for="javascript">JavaScript</label><br />
            </form>

            <!-- botão submit  -->
            <form>
                <label>Campo de submit</label>
                <input type="submit" value="Enviar" />
            </form>

            <!-- campo de limpar campos -->
            <form>
                <label>Campo de limpar campos</label>
                <input type="reset" value="Limpar" />
            </form>

            <!-- botão genérico  -->
            <form>
                <label>Campo de botão genérico</label>
                <input type="button" value="Clique em mim" onclick="alert('O botão foi clicado!')">
            </form>

            <!-- área para textos maiores -->
            <textarea placeholder="Digite sua mensagem..."  id="textoGrande" name="textoGrande" ></textarea>
    </body>
</html>
